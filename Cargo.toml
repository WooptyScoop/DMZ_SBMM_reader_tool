[package]
name = "dmz-sbmm-reader"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only DMZ SBMM local file scanner and match probe - rewritten in Rust with Rune UI"
publish = false

[dependencies]
rune = { path = "vendor/rune/crates/rune" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["vulkan", "wgsl"] }

[profile.release]
codegen-units = 16
lto = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
sctk-adwaita = { path = "vendor/rune/vendor/sctk-adwaita" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "vendor/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "vendor/rune/vendor/accesskit_macos" }

